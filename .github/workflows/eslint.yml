name: ESLint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint backend
        working-directory: backend
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file ../eslint-backend.sarif
        continue-on-error: true

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file ../eslint-frontend.sarif
        continue-on-error: true

      - name: Upload backend results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-backend.sarif
          category: eslint-backend

      - name: Upload frontend results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-frontend.sarif
          category: eslint-frontend