name: ESLint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            shared/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file ../eslint-backend.sarif
        continue-on-error: true

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file ../eslint-frontend.sarif
        continue-on-error: true

      - name: Lint shared
        working-directory: shared
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file ../eslint-shared.sarif
        continue-on-error: true

      - name: Upload backend results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-backend.sarif
          category: eslint-backend

      - name: Upload frontend results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-frontend.sarif
          category: eslint-frontend

      - name: Upload shared results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-shared.sarif
          category: eslint-shared