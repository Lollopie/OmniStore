name: NestJS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_backend:
    runs-on: ubuntu-latest

    # Spin up a PostgreSQL service container
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Wait until Postgres is healthy before starting the Node.js steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json

      - name: Install shared dependencies
        run: |
          npm ci
          npm run build
        working-directory: shared

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Initialize test database
        run: psql -v ON_ERROR_STOP=1 -h localhost -U test_user -d test -f backend/init-test-db.sql --set MIGRATOR_ROLE=nestjs_migrator --set MIGRATOR_PASSWORD=migratorpassword --set APP_ROLE=nestjs_app_user --set APP_PASSWORD=apppassword --set DATABASE_NAME=test

      - name: Run Migrations
        run: npm run migration:run
        working-directory: backend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          MIGRATION_USER: nestjs_migrator
          MIGRATION_PASSWORD: migratorpassword
          DATABASE_NAME: test

      - name: Run Unit Tests
        run: npm run test
        working-directory: backend

      - name: Run E2E Tests
        working-directory: backend
        run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          APP_USER: nestjs_app_user
          APP_PASSWORD: apppassword
          DATABASE_NAME: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: redis://localhost:6379

  test_playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build shared
        run: |
          npm ci
          npm run build
        working-directory: shared

      - name: Build backend
        run: |
          npm ci
          npm run build # Generates dist/ needed for 'npm run start'
        working-directory: backend

      - name: Initialize test database
        run: psql -v ON_ERROR_STOP=1 -h localhost -U test_user -d test -f backend/init-test-db.sql
        env:
          PGPASSWORD: test_password

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Cache Playwright browser binaries to speed up CI runs
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Install Playwright OS Dependencies (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
        working-directory: frontend

      - name: Run Playwright Tests
        run: npx playwright test
        working-directory: frontend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          APP_USER: app_test_user
          APP_PASSWORD: apppassword
          DATABASE_NAME: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: redis://localhost:6379
          CI: true

      # Upload trace reports on test failure for debugging
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  cd-deploy:
    name: Deploy to Production
    needs: [test_backend, test_playwright] # Only deploy if BOTH unit tests & Playwright pass
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          echo "Triggering deployment on Render..."
          curl -s "${{secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL}}" > /dev/null
          curl -s "${{secrets.RENDER_BACKEND_DEPLOY_HOOK_URL}}" > /dev/null
      - name: Wait for Deployment to Complete
        run: |
          echo "Waiting for deployment to complete..."
          sleep 60  # Adjust the sleep duration as needed
      - name: Post Deployment Health Check
        run: |
          APP_URL="https://omnistore-cqds.onrender.com/healthz"
          MAX_RETRIES=5
          RETRY_INTERVAL=15
          
          echo "Commencing Health Check on $APP_URL"
          
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" "$APP_URL" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Success! Application is live and healthy (HTTP 200)."
              exit 0
            else
              echo "Attempt $i failed (HTTP Status: $STATUS). Retrying in $RETRY_INTERVAL seconds..."
              sleep $RETRY_INTERVAL
            fi
          done
          
          echo "CRITICAL: Health check timed out or failed. Production may be broken!"
          exit 1